{% extends 'base.html' %}
{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="brand">VYXEL</div>
    <p class="subtitle">Create your account</p>

    <form method="post" action="/api/register" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">

      <label for="display_name">Display name</label>
      <input id="display_name" name="display_name" type="text" maxlength="80" placeholder="Your name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="12" placeholder="At least 12 characters" autocomplete="new-password" required>

      <button type="submit">Create account</button>
    </form>

    <div class="divider"><span>or sign up with</span></div>

    <div class="social-grid">
      <a class="social {% if not google_enabled %}disabled{% endif %}" href="{% if google_enabled %}/api/auth/google{% else %}#{% endif %}">Google</a>
      <a class="social {% if not apple_enabled %}disabled{% endif %}" href="{% if apple_enabled %}/api/auth/apple{% else %}#{% endif %}">Apple</a>
      <a class="social {% if not github_enabled %}disabled{% endif %}" href="{% if github_enabled %}/api/auth/github{% else %}#{% endif %}">GitHub</a>
      <a class="social {% if not microsoft_enabled %}disabled{% endif %}" href="{% if microsoft_enabled %}/api/auth/microsoft{% else %}#{% endif %}">Microsoft</a>
    </div>

    <p class="account-switch">Already have an account? <a href="/api/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
