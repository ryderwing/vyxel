{% extends 'base.html' %}{% block content %}<h1>{{ user.display_name }} <span class='role'>{{ user.role }}</span></h1>{% if user.role=='client' %}<section class='card'><h2>New pentest ticket</h2><form method='post' action='/tickets'><input type='hidden' name='csrf_token' value='{{ csrf }}'><input name='title' placeholder='Ticket title' required><input name='target' placeholder='Target' required><textarea name='scope' rows='8' placeholder='Authorized scope, dates, exclusions, rules of engagement' required></textarea><label><input type='checkbox' name='authorization_confirmed' value='yes' required> I confirm I own this target or have explicit permission to test it.</label><button class='btn'>Create ticket</button></form></section>{% endif %}<section class='card'><h2>Tickets</h2>{% for t in tickets %}<a class='ticket' href='/tickets/{{ t.id }}'><span>#{{ t.id }} {{ t.title }}<small>{{ t.target }}</small></span><b>{{ t.status }}</b></a>{% else %}<p>No tickets yet.</p>{% endfor %}</section>{% endblock %}
