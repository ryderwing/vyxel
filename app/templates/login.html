{% extends 'base.html' %}{% block content %}<div class='auth card'><h1>Sign in</h1><form method='post' action='/login'><input type='hidden' name='csrf_token' value='{{ csrf }}'><input name='email' type='email' placeholder='Email' required><input name='password' type='password' placeholder='Password' required><button class='btn'>Sign in</button></form><div class='oauth'><a class='{% if not google_enabled %}disabled{% endif %}' href='{% if google_enabled %}/auth/google{% else %}#{% endif %}'>Continue with Google</a><a class='{% if not apple_enabled %}disabled{% endif %}' href='{% if apple_enabled %}/auth/apple{% else %}#{% endif %}'>Continue with Apple</a></div></div>{% endblock %}
